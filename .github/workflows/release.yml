name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Determine version from tag"
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: "Pre-release validation (required files + repo constants)"
        shell: bash
        run: |
          set -euo pipefail

          # Required files
          test -f website-support.php
          test -f CHANGELOG.md
          test -f docs/PLUGIN_SPEC.md
          test -d includes

          # Repo constants (ensure updater points at the correct repo)
          grep -q "define( 'BWS_GITHUB_OWNER', 'bestwebsite' );" website-support.php
          grep -q "define( 'BWS_GITHUB_REPO', 'website-support' );" website-support.php

          echo "Pre-release validation passed."

      - name: "Guard: CHANGELOG must contain this version"
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing heading: ## [$VERSION] - YYYY-MM-DD"
            exit 1
          fi
          echo "CHANGELOG guard passed."

      - name: "PHP lint (fail fast)"
        shell: bash
        run: |
          set -euo pipefail
          php -v
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -name "*.php" -print0)

      - name: "Patch version in website-support.php (from tag)"
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"].strip()
          p = pathlib.Path("website-support.php")
          s = p.read_text(encoding="utf-8")

          # Update plugin header "Version:"
          s = re.sub(r'(?m)^\s*\*\s*Version:\s*.*$', f' * Version: {version}', s)

          # Update BWS_VERSION constant (must exist in file)
          s = re.sub(
              r"(?m)^define\(\s*'BWS_VERSION'\s*,\s*'[^']*'\s*\)\s*;\s*$",
              f"define( 'BWS_VERSION', '{version}' );",
              s
          )

          p.write_text(s, encoding="utf-8")
          print("Patched website-support.php to", version)
          PY

      - name: "Build release ZIP (website-support.zip)"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/website-support

          rsync -a --delete             --exclude ".git"             --exclude ".github"             --exclude "dist"             --exclude "**/.DS_Store"             ./ dist/website-support/

          (cd dist && zip -qr ../website-support.zip website-support)
          ls -lah website-support.zip

      - name: "Validate ZIP content"
        shell: bash
        run: |
          set -euo pipefail
          unzip -t website-support.zip > /dev/null

          # Must contain the correct plugin root and main file
          unzip -l website-support.zip | grep -q "website-support/website-support.php"

          # Ensure the version inside the zipped file matches the tag
          VERSION="${{ steps.vars.outputs.version }}"
          unzip -p website-support.zip website-support/website-support.php | grep -q "Version: ${VERSION}"
          unzip -p website-support.zip website-support/website-support.php | grep -q "define( 'BWS_VERSION', '${VERSION}' );"

          echo "ZIP validation passed."

      - name: "Create GitHub Release and upload ZIP asset"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: website-support.zip
