name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version from tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pre-release validation (repo + required files)
        shell: bash
        run: |
          set -euo pipefail
          test -f website-support.php
          test -d includes
          test -f includes/class-bws-github-updater.php
          echo "Pre-release validation passed."

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          php -v
          # Lint all php files (fail fast)
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -name "*.php" -print0)

      - name: Patch version in website-support.php (single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          python3 - <<'PY'
          import re, pathlib, os
          version=os.environ["VERSION"]
          p=pathlib.Path("website-support.php")
          s=p.read_text(encoding="utf-8")
          # Plugin header version
          s=re.sub(r"(?m)^\\s*\\*\\s*Version:\\s*.*$", f" * Version: {version}", s)
          # BWS_VERSION constant
          s=re.sub(r"(?m)^define\\(\\s*'BWS_VERSION'\\s*,\\s*'[^']*'\\s*\\);\\s*$", f"define( 'BWS_VERSION', '{version}' );", s)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Guard: website-support.php contains correct repo constants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "define( 'BWS_GITHUB_OWNER', 'bestwebsite' );" website-support.php
          grep -q "define( 'BWS_GITHUB_REPO', 'website-support' );" website-support.php

      - name: Build release ZIP (website-support.zip)
        shell: bash
        run: |
          set -euo pipefail
          rm -f website-support.zip
          mkdir -p dist/website-support
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "dist" \
            ./ dist/website-support/
          (cd dist && zip -qr ../website-support.zip website-support)

      - name: Validate ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -t website-support.zip > /dev/null
          # Ensure the plugin file exists in zip
          unzip -l website-support.zip | grep -q "website-support/website-support.php"
          # Ensure we did not accidentally introduce weird tokens (like $11.0.0$2) in plugin file
          unzip -p website-support.zip website-support/website-support.php | grep -q "define( 'BWS_VERSION', '${{ steps.vars.outputs.version }}' );"
          if unzip -p website-support.zip website-support/website-support.php | grep -q "\\$[0-9]\\+\\.[0-9]\\+\\.[0-9]\\+\\$"; then
            echo "ERROR: Detected suspicious token like $X.Y.Z$ in website-support.php"
            exit 1
          fi

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: website-support.zip
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
