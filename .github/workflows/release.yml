name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version from tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pre-release validation (repo + required files)
        shell: bash
        run: |
          set -euo pipefail
          test -f website-support.php
          test -d includes
          test -f includes/class-bws-github-updater.php
          echo "Pre-release validation passed."

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          php -v
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find . -name "*.php" -print0)

      - name: Patch version in website-support.php (single source of truth)
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"].strip()
          p = pathlib.Path("website-support.php")
          s = p.read_text(encoding="utf-8")

          # Update plugin header "Version:"
          s = re.sub(r'(?m)^\s*\*\s*Version:\s*.*$',
                     f' * Version: {version}', s)

          # Update BWS_VERSION constant if present
          s = re.sub(r"(?m)^(define\(\s*'BWS_VERSION'\s*,\s*')[^']+('\s*\)\s*;)",
                     rf"\g<1>{version}\g<2>", s)

          p.write_text(s, encoding="utf-8")
          print("Patched version to", version)
          PY

      - name: Build release zip (website-support.zip)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/website-support

          rsync -a \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".gitignore" \
            --exclude ".DS_Store" \
            --exclude "dist" \
            ./ dist/website-support/

          (cd dist && zip -qr ../website-support.zip website-support)
          ls -lah website-support.zip

      - name: Validate zip contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -t website-support.zip > /dev/null
          unzip -l website-support.zip | grep -q "website-support/website-support.php" || {
            echo "ERROR: ZIP missing website-support/website-support.php"
            exit 1
          }
          unzip -p website-support.zip website-support/website-support.php | grep -q "Plugin Name:" || {
            echo "ERROR: website-support.php in ZIP missing plugin header"
            exit 1
          }
          echo "Zip validation passed."

      - name: Create GitHub release + upload zip asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            website-support.zip
